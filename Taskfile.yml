version: '3'

vars:
  MODULE: .
  MODULES:
    - .
    - adapters/kernel
    - adapters/postgres
    - adapters/redis
    - examples

tasks:
  default:
    desc: Show available tasks; use `task check-all` to run all module checks
    cmds:
      - task --list

  check:
    desc: Check one Go module, including formatting and golangci-lint (e.g. task check -- adapters/redis)
    vars:
      TARGET_MODULE: '{{default .MODULE .CLI_ARGS}}'
    dir: '{{.TARGET_MODULE}}'
    cmds:
      - cmd: 'echo "Checking Go module: {{.TARGET_MODULE}}"'
      - go mod tidy -diff
      - go test -mod=readonly ./...
      - go build -mod=readonly ./...
      - go vet -mod=readonly ./...
      - go test -race -mod=readonly ./...
      - golangci-lint fmt --diff
      - golangci-lint run --timeout=5m ./...

  check-all:
    desc: Run check sequentially for all five Go modules
    cmds:
      - for: {var: MODULES}
        task: check
        vars:
          MODULE: '{{.ITEM}}'
